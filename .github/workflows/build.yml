name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate
        shell: bash
        run: bash scripts/validate.sh
      - name: Check the Studio files
        shell: bash
        run: bash scripts/studio.sh "$(cygpath -u "$RUNNER_TEMP")/studio"
      - name: Build the website
        shell: bash
        run: bash scripts/build-site.sh
