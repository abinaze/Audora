version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Microsoft runtime packages stay on the same major version as the .NET 8 target.
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # NAudio 2.4 makes BufferedWaveProvider.BufferDuration read-only, and the engine sets it.
      # Moving needs a code change and a listening test, so minor updates wait. Patches of 2.2.x still arrive.
      - dependency-name: "NAudio"
        update-types: ["version-update:semver-minor"]
    groups:
      test-tools:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
