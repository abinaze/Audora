name: Bug report
description: Something is not working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting this. The more detail you give, the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start music
        2. Run Audora with two devices
        3. Turn one device off
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Audora version
      placeholder: "For example 0.1.0, or the commit you built"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "For example Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Audio devices involved
      description: Name and type of each (Bluetooth, USB, HDMI, 3.5 mm). Running `dotnet run --project tools/Audora.Cli -- list` and pasting the result is perfect.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Messages or logs
      description: Anything Audora printed, such as error codes.
      render: shell
    validations:
      required: false
